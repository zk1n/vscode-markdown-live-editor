<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>v0.2 interaction review harness</title>
    <style>
      html,
      body {
        margin: 0;
        background: #1e1e1e;
        color: #ddd;
        font: 14px sans-serif;
        --vscode-editor-background: #1e1e1e;
        --vscode-editor-foreground: #ddd;
        --vscode-editorWidget-background: #252526;
        --vscode-editorCursor-foreground: #fff;
        --vscode-focusBorder: #168bdd;
      }
      #editor-root {
        height: 540px;
        width: 900px;
        max-width: 100vw;
      }
      .cm-editor {
        height: 100%;
      }
      button {
        margin: 4px;
      }
      #source-output {
        white-space: pre-wrap;
        font: 12px monospace;
      }
      body[data-theme="light"] {
        background: #fff;
        color: #333;
        --vscode-editor-background: #fff;
        --vscode-editor-foreground: #333;
        --vscode-editorWidget-background: #f3f3f3;
        --vscode-editorWidget-foreground: #333;
        --vscode-input-background: #fff;
        --vscode-input-foreground: #333;
        --vscode-editorCursor-foreground: #000;
        --vscode-editor-selectionBackground: #add6ff;
        --vscode-editor-inactiveSelectionBackground: #e5ebf1;
        --vscode-editor-findMatchBackground: #a8ac94;
        --vscode-editor-findMatchHighlightBackground: #ea5c0055;
      }
      body[data-theme="contrast"] {
        background: #000;
        color: #fff;
        --vscode-editor-background: #000;
        --vscode-editor-foreground: #fff;
        --vscode-editorWidget-background: #000;
        --vscode-editorWidget-foreground: #fff;
        --vscode-input-background: #000;
        --vscode-input-foreground: #fff;
        --vscode-editor-selectionBackground: #264f78;
        --vscode-editor-inactiveSelectionBackground: #264f78;
        --vscode-contrastBorder: #6fc3df;
        --vscode-editor-findMatchBorder: #f38518;
        --vscode-editor-findMatchHighlightBorder: #f38518;
      }
      #editor-status {
        display: none;
      }
    </style>
  </head>
  <body>
    <div>
      <button id="reset">初期状態</button><button id="narrow">狭幅切替</button
      ><button id="paste-image">画像Pasteイベント</button
      ><button id="defer-image">取込応答の保留切替</button
      ><button id="release-image">保留応答を返す</button><button id="outside">別UI</button>
      <select id="theme" aria-label="テーマ">
        <option value="dark">Dark</option>
        <option value="light">Light</option>
        <option value="contrast">High Contrast</option>
      </select>
      <button id="fourth-fixture">第四改修fixture</button
      ><button id="minimap-toggle">ミニマップ切替</button> <button id="metrics">表示位置計測</button
      ><button id="font">文字サイズ切替</button>
    </div>
    <button id="large-fixture">大文書fixture</button>
    <select id="geometry-fixture" aria-label="座標fixture">
      <option value="initial">初期</option>
      <option value="plain">表なし</option>
      <option value="one">表1個</option>
      <option value="two">表2個</option>
      <option value="short">20行</option>
      <option value="medium">100行</option>
      <option value="long">長文</option>
      <option value="fifth">第五レビュー</option>
    </select>
    <main id="editor-root"></main>
    <div id="editor-status"></div>
    <div id="result" role="status">起動中</div>
    <pre id="metrics-output" aria-label="表示計測"></pre>
    <pre id="source-output" aria-label="現在のMarkdown"></pre>
    <script src="/dist/interaction-harness.js"></script>
  </body>
</html>
