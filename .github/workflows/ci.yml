name: CI

on:
  push:
    branches:
      - main
      - develop
      - test
      - "release/**"
      - "feat/**"
      - "fix/**"
      - "refactor/**"
      - "chore/**"
      - "docs/**"
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install
        run: npm ci

      - name: Check
        run: npm run check
